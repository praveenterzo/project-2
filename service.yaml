apiVersion: v1
kind: Service
metadata:
  name: trend-app-lb
  namespace: default
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: trend-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
